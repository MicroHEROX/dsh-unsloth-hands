# Minimal dsh-unsloth composition for the REAL-composition loader smoke:
# the same app boot path a deployment uses (app bin -> Cordis Loader ->
# cordis.yml), with the external Unsloth server mocked by the test driver.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: unsloth-tool
  name: '../../../src/index.ts'
  config:
    baseURL: 'http://127.0.0.1:39410'
    apiKey: 'sk-unsloth-loader-key'
